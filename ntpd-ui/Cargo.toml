[package]
name = "ntpd-ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ntpd-ui-server"
path = "src/server.rs"

[dependencies]
# Dioxus - UI Framework (только для WASM фронтенда)
dioxus = { version = "0.5", features = ["web", "router"], optional = true }

# Web utilities (для WASM)
reqwest = { version = "0.11", features = ["json"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
futures = { version = "0.3", optional = true }
tracing-wasm = { version = "0.2", optional = true }

# HTTP Server (для бэкенда)
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# CRITICAL FIX FOR WASM: Enable JS support for random number generation
getrandom = { version = "0.2", features = ["js"], optional = true }

# Common types
ntp-proto = { path = "../ntp-proto", default-features = false }
ntpd = { path = "../ntpd", optional = true }

# Logging
tracing = "0.1"

[features]
default = ["frontend"]
frontend = ["dioxus", "reqwest", "wasm-bindgen", "futures", "tracing-wasm", "getrandom"]
backend = ["axum", "tokio", "tower-http", "tracing-subscriber", "ntpd"]
